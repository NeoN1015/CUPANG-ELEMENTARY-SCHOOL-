<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Principal Dashboard · CES</title>
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;900&display=swap" rel="stylesheet" />
  <link rel="icon" href="/pics/web/seal.png" />
  <link rel="stylesheet" href="/calendar/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
</head>
<body>
  <div class="eave" aria-hidden="true"></div>
  <header class="topbar">
    <a class="brand" href="/home.html"><img src="/pics/web/seal.png" alt="" width="36" height="36" />CESMAIN <small>Principal</small></a>
    <nav>
      <a href="#events">Events <span id="pendingBadge" class="badge count" hidden>0</span></a>
      <a href="#memos">Memos</a>
      <a href="#accounts">Accounts</a>
      <a href="#messages">Messages <span id="messageBadge" class="badge count" hidden>0</span></a>
      <a href="/home.html">Public site</a>
    </nav>
    <span class="user" data-user-name></span>
    <button type="button" class="small" data-change-password>Password</button>
    <button type="button" class="small" data-logout>Logout</button>
  </header>

  <main>
    <!-- Events -->
    <section class="card" id="events">
      <header>
        <h2>School events</h2>
        <label class="inline">Show
          <select id="eventFilter">
            <option value="all">All events</option>
            <option value="pending">Pending approval</option>
            <option value="mine">Added by me</option>
          </select>
        </label>
        <button type="button" id="openModalBtn">+ Add event</button>
      </header>
      <div class="grid-2">
        <div class="table-wrap">
          <table>
            <thead><tr><th>Event</th><th>Date</th><th>Time</th><th>Description</th><th>Actions</th></tr></thead>
            <tbody id="eventTable"></tbody>
          </table>
        </div>
        <div id="calendar"></div>
      </div>
    </section>

    <!-- Memos -->
    <section class="card" id="memos">
      <header><h2>Memos to teachers</h2></header>
      <div class="grid-2">
        <form id="memoForm" class="stack">
          <h3 id="memoFormTitle">New memo</h3>
          <div class="row">
            <label>From<input name="sender" required maxlength="100" /></label>
            <label>To
              <input name="recipient" list="recipientOptions" required maxlength="100" />
              <datalist id="recipientOptions">
                <option value="All Teachers"></option>
                <option value="Kindergarten Teachers"></option>
                <option value="Grade 1 Teachers"></option>
                <option value="Grade 2 Teachers"></option>
                <option value="Grade 3 Teachers"></option>
                <option value="Grade 4 Teachers"></option>
                <option value="Grade 5 Teachers"></option>
                <option value="Grade 6 Teachers"></option>
              </datalist>
            </label>
          </div>
          <label>Subject<input name="subject" required maxlength="200" /></label>
          <label>Title<input name="title" required maxlength="200" /></label>
          <label>Content<textarea name="content" rows="6" required></textarea></label>
          <div class="row">
            <label>Date<input type="date" name="date" required /></label>
            <label>Time<input type="time" name="time" /></label>
          </div>
          <label class="inline"><input type="checkbox" name="urgent" /> Mark as urgent</label>
          <div>
            <button type="submit">Post memo</button>
            <button type="button" id="memoCancel" class="secondary" hidden>Cancel edit</button>
          </div>
        </form>
        <div id="memoList" class="memo-list"></div>
      </div>
    </section>

    <!-- Accounts -->
    <section class="card" id="accounts">
      <header><h2>Teacher &amp; student accounts</h2></header>
      <div class="grid-2">
        <form id="accountForm" class="stack">
          <h3>Create account</h3>
          <label>Role
            <select name="role">
              <option value="teacher">Teacher</option>
              <option value="student">Student</option>
            </select>
          </label>
          <label>Full name<input name="name" required maxlength="100" /></label>
          <label id="accountIdLabel">Employee ID<input name="login_id" required maxlength="100" /></label>
          <label>Temporary password (min 8 characters)<input type="text" name="password" required minlength="8" autocomplete="new-password" /></label>
          <div><button type="submit">Create account</button></div>
        </form>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Role</th><th>Login ID</th><th></th></tr></thead>
            <tbody id="accountTable"></tbody>
          </table>
        </div>
      </div>
    </section>

    <!-- Messages -->
    <section class="card" id="messages">
      <header><h2>Messages from visitors</h2></header>
      <div id="messageList" class="memo-list"></div>
    </section>
  </main>

  <!-- Event dialog -->
  <dialog id="eventModal">
    <h2 id="modalTitle">Add event</h2>
    <form id="eventForm" class="stack">
      <label>Event name<input name="name" required maxlength="200" /></label>
      <div class="row">
        <label>Date<input type="date" name="date" required /></label>
        <label>Category
          <select name="category">
            <option>General</option><option>Holiday</option><option>Exam</option><option>PTA</option><option>Program</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Start time<input type="time" name="time" step="300" /></label>
        <label>End time<input type="time" name="endTime" step="300" /></label>
      </div>
      <label>Description<textarea name="description" rows="3"></textarea></label>
      <div class="buttons">
        <button type="button" class="secondary" data-close-event>Cancel</button>
        <button type="submit">Save event</button>
      </div>
    </form>
  </dialog>

  <script src="/calendar/api.js"></script>
  <script src="/calendar/calendar.js"></script>
  <script src="/calendar/add-memo.js"></script>
  <script src="/calendar/principal-admin.js"></script>
</body>
</html>
